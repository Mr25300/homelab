services:
  playit-agent:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    container_name: playit-agent
    network_mode: host
    environment:
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped
    healthcheck: # Fixes connection breaking after waking up from suspend
      test: ["CMD", "ping", "-c", "1", "1.1.1.1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
