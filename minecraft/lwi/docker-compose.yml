services:
  server:
    image: itzg/minecraft-server:latest
    labels:
      mc-router.host: records-armor.gl.joinmc.link,records-armor.gl.at.ply.gg
    environment: # https://docker-minecraft-server.readthedocs.io/en/latest/variables/#rcon
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      FORGE_VERSION: "latest"
      INIT_MEMORY: "4G"
      MAX_MEMORY: "8G"

      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "12"

      MOTD: "Lucky World Invasion Test"
      ENABLE_WHITELIST: "true"
      WHITELIST: "AwesomeFeet313,AKAPVP66,Ginormous_G,shubabidi,ultra_exdi,Mineor23"
      OPS: "AwesomeFeet313"
      EXISTING_WHITELIST_FILE: "MERGE"
      EXISTING_OPS_FILE: "MERGE"
      ALLOW_FLIGHT: "true" # For mods
    volumes:
      - ./data:/data
    restart: no
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 9G
          cpus: '2'
    networks:
      - mc-net

networks:
  mc-net:
    external: true
