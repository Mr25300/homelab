name: servarr

services:
  radarr: # Port 7878
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    # depends_on:
    #   - prowlarr
    networks:
      - gls
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Toronto
    volumes:
      - /storage/radarr:/config
      - /storage/media/movies:/movies
      - /storage/qbittorrent/completed:/downloads
    restart: unless-stopped

  # sonarr:
