name: caddy

services:
  caddy:
    build: .
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - data:/data
      - config:/config
    networks:
      - gls
    dns: # Requesting certificates does not work with Technitium (TODO: find out why)
      - 9.9.9.9
      - 1.1.1.1
    restart: unless-stopped

volumes:
  data:
  config:

networks:
  gls:
    external: true
