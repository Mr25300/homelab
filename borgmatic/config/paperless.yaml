<<: !include [shared/defaults.yaml, shared/standard.yaml, shared/database.yaml]

constants:
  service: paperless
  db_dump_cmd: "docker exec paperless-db pg_dump -U paperless paperless"

source_directories:
  - /mnt/source/paperless

exclude_patterns:
  - /mnt/source/paperless/consume
  - /mnt/source/paperless/export
  - /mnt/source/paperless/pgdata
  - "sh:**/log/**"
