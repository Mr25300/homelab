name: uptime-kuma

services:
  uptime-kuma: # Port 3001
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    environment:
      TZ: America/Toronto
    networks:
      - gls
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/storage/uptime-kuma:/app/data
    restart: unless-stopped

networks:
  gls:
    external: true
